server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: ragchatmanagement
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rag_db}?serverTimezone=Asia/Kolkata
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:mysecretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        format_sql: true

  jackson:
    time-zone: Asia/Kolkata

springdoc:
  swagger-ui:
    path: /           # Make Swagger UI available at the root URL
    operationsSorter: method
    display-request-duration: true
    doc-expansion: list
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins:
    - "http://localhost:8080"
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "Authorization"
    - "Content-Type"
    - "X-API-KEY"
  exposed-headers:
    - "Authorization"
  allow-credentials: true

security:
  api-key: my-secret-api-key
  rate-limit:
    capacity: 100
    duration-minutes: 1


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
