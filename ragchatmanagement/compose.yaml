services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=rag_db'
      - 'POSTGRES_PASSWORD=mysecretpassword'
      - 'POSTGRES_USER=postgres'
      - 'TZ=Asia/Kolkata'
    ports:
      - '5432:5432'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
